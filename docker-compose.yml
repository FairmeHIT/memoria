services:
  memoria:
    build: .
    ports:
      - "8080:8080"
    environment:
      MEMORIA_API_KEY: ${MEMORIA_API_KEY:?Set MEMORIA_API_KEY in your shell or .env file}
      MEMORIA_AUTH_SCHEME: ${MEMORIA_AUTH_SCHEME:-bearer}
      MEMORIA_DATA_DIR: /var/lib/memoria
      MEMORIA_RETENTION_DAYS: ${MEMORIA_RETENTION_DAYS:-30}
      MEMORIA_MAX_TOP_K: ${MEMORIA_MAX_TOP_K:-1000}
      MEMORIA_EMBEDDING_BACKEND: ${MEMORIA_EMBEDDING_BACKEND:-none}
      MEMORIA_EMBEDDING_MODEL: ${MEMORIA_EMBEDDING_MODEL:-text-embedding-v4}
      MEMORIA_EMBEDDING_DIMENSIONS: ${MEMORIA_EMBEDDING_DIMENSIONS:-1024}
      MEMORIA_EMBEDDING_BASE_URL: ${MEMORIA_EMBEDDING_BASE_URL:-}
      MEMORIA_RERANKER_BACKEND: ${MEMORIA_RERANKER_BACKEND:-none}
      MEMORIA_RERANKER_MODEL: ${MEMORIA_RERANKER_MODEL:-qwen3-rerank}
      MEMORIA_RERANKER_BASE_URL: ${MEMORIA_RERANKER_BASE_URL:-}
      MEMORIA_RERANKER_CANDIDATE_LIMIT: ${MEMORIA_RERANKER_CANDIDATE_LIMIT:-200}
      MEMORIA_QWEN_API_KEY: ${MEMORIA_QWEN_API_KEY:-}
      MEMORIA_QWEN_TIMEOUT_SECONDS: ${MEMORIA_QWEN_TIMEOUT_SECONDS:-15}
      MEMORIA_QWEN_RETRIES: ${MEMORIA_QWEN_RETRIES:-2}
      MEMORIA_GPT4O_API_KEY: ${MEMORIA_GPT4O_API_KEY:-}
      MEMORIA_GPT4O_BASE_URL: ${MEMORIA_GPT4O_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      API_KEY: ${API_KEY:-}
      MEMORIA_BGE_API_KEY: ${MEMORIA_BGE_API_KEY:-}
      MEMORIA_BGE_BASE_URL: ${MEMORIA_BGE_BASE_URL:-http://host.docker.internal:8000}
      MEMORIA_BGE_AUTH_SCHEME: ${MEMORIA_BGE_AUTH_SCHEME:-bearer}
      MEMORIA_BGE_EMBEDDING_MODEL: ${MEMORIA_BGE_EMBEDDING_MODEL:-BAAI/bge-m3}
      MEMORIA_BGE_RERANKER_MODEL: ${MEMORIA_BGE_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
    volumes:
      - memoria-data:/var/lib/memoria

volumes:
  memoria-data:
